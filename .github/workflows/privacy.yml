# Refuses a pull request that would publish a session link, a credential or personal data.
name: Privacy
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true   # a new push replaces the run of the old one

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole pull request range is scanned
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          tools/privacy-check.sh message "$RUNNER_TEMP/pr.txt"
          tools/privacy-check.sh range "$BASE..$HEAD"

# The site and the help (docs/) on GitHub Pages, deployed by this workflow instead of Pages' own branch build: that one
# gives up after 10 minutes, and a slow GitHub queue made it fail once with nothing wrong in docs/ (09/11/2026). Here the
# deploy waits longer and tries once more. Needs Settings → Pages → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # a deploy halfway is never cut: the next one waits

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.again.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs
      - id: first
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        continue-on-error: true
        with:
          timeout: 1200000   # 20 min (Pages' own build stops at 10)
      - id: again
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 1200000

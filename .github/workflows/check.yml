# Builds, runs the tests and lint. Nothing is published or signed here (releases: release.yml).
name: Check
# Only on pull requests into main (day-to-day work is on the dev branch) or by hand (Actions → Check → Run workflow):
# each run takes ~10 min of GitHub's Actions minutes. Not again after the merge: the PR already tested the same code.
# Memory/docs, the MCP server (mcp-check.yml tests it) and the button-only workflows don't touch the app: no build. The
# job is skipped, not the workflow: a required check that never runs would hold the pull request forever (a skip passes)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true   # a new push replaces the run of the old one

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # by hand there's no range: build
          app=true
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE...$HEAD" \
              | grep -vE '^(\.claude/|docs/|mcp/|tools/help_|tools/screenshots|\.github/workflows/(help|mcp-|privacy|release))|\.md$' \
              | grep -q . || app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # the version comes from the commit count
      # first, it takes a second: a change to the app says what's new for the update window
      - run: python3 -I tools/release_notes_test.py
      # the editor page's setlist breaks (node comes with the runner)
      - run: python3 -I tools/web_breaks_test.py
      - if: github.event_name == 'pull_request'
        run: python3 -I tools/release_notes.py check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu already has the Android SDK (ANDROID_HOME); only the engine's NDK version is missing
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
      - run: ./gradlew --build-cache assembleDebug testDebugUnitTest lintDebug
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: reports
          path: app/build/reports/

# Publishing a version is a button on GitHub, nothing runs on a local machine: Actions → Release → Run workflow, on
# main only (pressed on dev, nothing runs). With "publish" unchecked it's a dry run (builds, signs, checks and keeps the
# APK as an artifact); checked, it also creates the v0.1.<commit count> tag and the release with the two fixed-name files the app reads from
# releases/latest/download/. The signing key lives only in the repository secrets: it's written to a temporary file
# and deleted at the end. The repository must be public: a private one needs a login, which the app doesn't have.
name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: write   # create the tag and the release

# two presses of the button wait in line: never two versions at once
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'   # from any other branch the button does nothing (no minutes spent)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # the version comes from the commit count
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu already has the Android SDK (ANDROID_HOME); only the engine's NDK version is missing
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STAGEBOOK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STAGEBOOK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGEBOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STAGEBOOK_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/stagebook-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/.android/stagebook-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > ~/.android/stagebook-release.properties
      - run: ./gradlew --build-cache testDebugUnitTest lintDebug assembleRelease
      - name: Check signature and version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # signed with Stagebook's key? (another key = devices refuse the update)
          CERT=a0af59f083c430bfcd0aa42ff825f01277f4afc3c3fb0f9aba80225842a1c4a5
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -q "SHA-256 digest: $CERT"
          badging=$("$TOOLS/aapt" dump badging "$APK" | head -1)
          code=$(sed -E "s/.*versionCode='([0-9]+)'.*/\1/" <<<"$badging")
          name=$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<<"$badging")
          mkdir -p out
          cp "$APK" out/stagebook.apk
          # the file the app reads: this version's notes on top of the last ones. No notes, no version (dry run included)
          # only the app's tags: the MCP has its own (mcp-v…)
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          # a failed download stops here: going on would publish a file without the notes of the versions before
          if [ -n "$last" ]; then gh release download "$last" --pattern stagebook-version.json --output previous.json; else echo '{}' > previous.json; fi
          python3 -I tools/release_notes.py build "${last:+$last..}HEAD" --code "$code" --name "$name" --previous previous.json --out out/stagebook-version.json --body release-body.md
          echo "tag=v${name%% *}" >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: stagebook-dry-run
          path: out/
      - name: Publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists: nothing new to publish."; exit 1
          fi
          # the description is what people will notice, as the app's update window says it (release-body.md, written
          # with stagebook-version.json), not the commit titles
          # GitHub sometimes answers 500 with everything built (05/11, three times in a row): only this step tries again
          for wait in 60 120 240 0; do
            gh release create "$TAG" out/stagebook.apk out/stagebook-version.json \
              --target "$GITHUB_SHA" --title "Stagebook ${TAG#v}" --notes-file release-body.md --latest && exit 0
            state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$state" = false ]; then exit 0; fi   # it went through and only the answer failed
            if [ "$state" = true ]; then gh release delete "$TAG" --yes || true; fi   # half done: the next try starts clean
            sleep "$wait"
          done
          exit 1
      - if: always()
        run: rm -f ~/.android/stagebook-release.jks ~/.android/stagebook-release.properties

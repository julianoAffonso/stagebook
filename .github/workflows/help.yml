# The help follows the app (tools/help_check.py): a change people notice comes with the help, a changed screen with new
# screenshots. Seconds, and on every pull request, so it says so before the build ends.
name: Help
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: help-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  help:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # the whole pull request range is read
      - run: python3 -I tools/help_check_test.py
      - run: python3 -I tools/help_check.py pages
      - run: python3 -I tools/help_check.py check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

# Compila, roda os testes e o lint. Nada é publicado nem assinado aqui.
name: Verificar
# Só ao juntar na main (o dia a dia é na branch dev) ou à mão (Actions → Verificar → Run workflow): cada rodada
# leva ~10 min dos minutos grátis do GitHub enquanto o repositório é privado
on:
  push:
    branches: [main]
    paths-ignore: [".claude/**", "**.md"]   # só memória/textos: não gasta minutos
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a versão vem do nº de commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # o Ubuntu do GitHub já traz o SDK do Android (ANDROID_HOME); falta só a versão do NDK do motor
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: app/build/reports/

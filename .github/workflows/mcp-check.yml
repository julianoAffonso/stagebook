# Builds and tests the MCP server when a pull request changes it (check.yml skips mcp/: no Gradle for it). Under a
# minute. Not again after the merge: the PR already tested the same code (and MCP publish tests before publishing).
name: MCP check
on:
  pull_request:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/mcp-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true   # a new push replaces the run of the old one

jobs:
  mcp:   # not "check": that name is the app's required check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

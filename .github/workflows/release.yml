# Builds, signs and publishes a release when a version tag (v0.1.<commit count>) is pushed by ./publish.sh.
# The signing key lives only in the repository secrets: this job writes it to a temporary file and deletes it at the
# end. The release carries two fixed-name files the app reads from releases/latest/download/.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # dry run by hand: builds, signs and checks, keeps the APK as an artifact, publishes nothing

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from the commit count
      # only what is on main gets published
      - if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu already has the Android SDK (ANDROID_HOME); only the engine's NDK version is missing
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STAGEBOOK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STAGEBOOK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGEBOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STAGEBOOK_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/stagebook-release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/.android/stagebook-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > ~/.android/stagebook-release.properties
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Check signature and version
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # signed with Stagebook's key? (another key = devices refuse the update)
          CERT=a0af59f083c430bfcd0aa42ff825f01277f4afc3c3fb0f9aba80225842a1c4a5
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -q "SHA-256 digest: $CERT"
          badging=$("$TOOLS/aapt" dump badging "$APK" | head -1)
          code=$(sed -E "s/.*versionCode='([0-9]+)'.*/\1/" <<<"$badging")
          name=$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<<"$badging")
          # the tag must match the version built from this commit
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v${name%% *}"; fi
          mkdir -p out
          cp "$APK" out/stagebook.apk
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$name" > out/stagebook-version.json
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: stagebook-dry-run
          path: out/
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # notes: the commit titles since the previous release
          last=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          notes=$(git log --format='- %s' ${last:+$last..}"$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" out/stagebook.apk out/stagebook-version.json \
            --title "Stagebook ${GITHUB_REF_NAME#v}" --notes "$notes" --latest
      - if: always()
        run: rm -f ~/.android/stagebook-release.jks ~/.android/stagebook-release.properties

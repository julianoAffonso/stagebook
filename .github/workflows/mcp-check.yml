# Builds and tests the MCP server when a pull request changes it (check.yml skips mcp/: no Gradle for it). Under a
# minute. Not again after the merge: the PR already tested the same code (and MCP publish tests before publishing).
name: MCP check
on:
  pull_request:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/mcp-*.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
